<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - www.kiosonline.shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#07090e] text-slate-100 font-sans antialiased min-h-screen p-4 sm:p-8" x-data="adminApp()">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <div class="glass-card p-6 rounded-3xl flex flex-col sm:flex-row justify-between items-center gap-4 border border-indigo-500/30 shadow-2xl">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-shield-halved text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-black text-white tracking-wide">KIOSONLINE ADMIN CENTER</h1>
                    <p class="text-[11px] text-emerald-400 font-medium">Manajemen Saldo & Password Pengguna</p>
                </div>
            </div>
            <a href="index.html" class="glass-card hover:bg-slate-800 text-slate-300 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition border border-slate-700">
                <i class="fa-solid fa-store mr-1.5"></i> Lihat Website Toko
            </a>
        </div>

        <!-- PANEL ATUR SALDO -->
        <div class="glass-card p-6 rounded-3xl shadow-2xl border border-slate-800 space-y-4">
            <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-wallet text-cyan-400"></i> Atur Saldo Pengguna
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5">EMAIL AKUN PENGGUNA</label>
                    <input type="email" x-model="targetEmail" placeholder="user@gmail.com" class="glass-card w-full rounded-xl px-3.5 py-2.5 text-xs text-slate-200 border border-slate-800 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5">NOMINAL SALDO BARU (RP)</label>
                    <input type="number" x-model="targetBalance" placeholder="50000" class="glass-card w-full rounded-xl px-3.5 py-2.5 text-xs font-bold text-emerald-400 border border-slate-800 focus:outline-none">
                </div>
                <div>
                    <button @click="updateBalance" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition shadow-lg">
                        Simpan Saldo
                    </button>
                </div>
            </div>
        </div>

        <!-- PANEL GANTI PASSWORD PENGGUNA -->
        <div class="glass-card p-6 rounded-3xl shadow-2xl border border-slate-800 space-y-4">
            <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-key text-yellow-400"></i> Ubah / Reset Password Pengguna
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5">EMAIL AKUN PENGGUNA</label>
                    <input type="email" x-model="passEmail" placeholder="user@gmail.com" class="glass-card w-full rounded-xl px-3.5 py-2.5 text-xs text-slate-200 border border-slate-800 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 mb-1.5">PASSWORD BARU</label>
                    <input type="text" x-model="newPassword" placeholder="Password baru" class="glass-card w-full rounded-xl px-3.5 py-2.5 text-xs font-bold text-yellow-400 border border-slate-800 focus:outline-none">
                </div>
                <div>
                    <button @click="updatePassword" class="w-full bg-gradient-to-r from-yellow-600 to-orange-500 hover:from-yellow-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition shadow-lg">
                        Simpan Password Baru
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SHEET_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbylei50vv5gmjYRGXrl0hotQ4DMVx8apUqjARuiZ8QQhvT_2JvFXe09cKFJcxKo3wnz2Q/exec';

        function adminApp() {
            return {
                targetEmail: '', targetBalance: 0,
                passEmail: '', newPassword: '',
                async updateBalance() {
                    if (!this.targetEmail) { alert('Masukkan email!'); return; }
                    try {
                        await fetch(SHEET_WEB_APP_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ 
                                action: 'updateBalance', 
                                email: this.targetEmail, 
                                balance: parseInt(this.targetBalance) 
                            })
                        });
                        alert('Saldo berhasil diperbarui ke Google Sheets!');
                        this.targetEmail = ''; this.targetBalance = 0;
                    } catch (err) { alert('Terjadi kesalahan saat memperbarui saldo.'); }
                },
                async updatePassword() {
                    if (!this.passEmail || !this.newPassword) { alert('Lengkapi email dan password baru!'); return; }
                    try {
                        await fetch(SHEET_WEB_APP_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ 
                                action: 'updatePassword', 
                                email: this.passEmail, 
                                password: this.newPassword 
                            })
                        });
                        alert('Password akun ' + this.passEmail + ' berhasil diubah!');
                        this.passEmail = ''; this.newPassword = '';
                    } catch (err) { alert('Terjadi kesalahan saat mengubah password.'); }
                }
            }
        }
    </script>
</body>
</html>
